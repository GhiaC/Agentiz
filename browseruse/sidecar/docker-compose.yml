name: ${BROWSER_USE_COMPOSE_PROJECT:-agentize-browser-use}

services:
  browser-use:
    image: ${BROWSER_USE_IMAGE_NAME:-agentize-browser-use:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${BROWSER_USE_PYTHON_IMAGE:-docker.arvancloud.ir/library/python:3.12-slim}
        DEBIAN_MIRROR: ${BROWSER_USE_DEBIAN_MIRROR:-https://archive.debian.petiak.ir/debian}
        DEBIAN_SECURITY_MIRROR: ${BROWSER_USE_DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
    init: true
    restart: unless-stopped
    env_file:
      - path: ${BROWSER_USE_ENV_FILE:-.env}
        required: true
    ports:
      - "${BROWSER_USE_BIND_ADDRESS:-127.0.0.1}:${BROWSER_USE_PORT:-8087}:8087"
    volumes:
      - browser-use-data:/data
    shm_size: "2gb"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/browseruse:size=64m,uid=911,gid=911
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8087/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  browser-use-data:
